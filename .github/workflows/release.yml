name: Release

on:
  push:
    tags: ['v*']

# One version number, every target, built from one tag push. WXT handles the
# manifest translation between them and emits the source bundle AMO requires.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check before shipping
        run: pnpm run check

      # WXT writes into apps/extension/.output, which is a hidden directory —
      # upload-artifact and some globs skip it. Copy to dist/ so the README
      # buttons (/releases/latest/download/sloppy-chrome.zip) keep working.
      - name: Package
        run: |
          pnpm --filter @sloppy/extension zip
          mkdir -p dist
          cp apps/extension/.output/sloppyextension-*-chrome.zip dist/sloppy-chrome.zip
          cp apps/extension/.output/sloppyextension-*-firefox.zip dist/sloppy-firefox.zip
          cp apps/extension/.output/sloppyextension-*-sources.zip dist/sloppy-sources.zip

      - name: Build Edge
        run: pnpm --filter @sloppy/extension build:edge

      - uses: actions/upload-artifact@v4
        with:
          name: sloppy-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: dist/*.zip
          body: |
            Built from `${{ github.sha }}`.

            Sharing is on by default. Tags go to the shared list so other
            installs can collapse the same posts. Turn it off in Settings and
            nothing leaves the device.

            Store submissions are still manual — each one needs its
            data-collection disclosure checked against what this build actually
            sends. See `docs/PRIVACY.md`.

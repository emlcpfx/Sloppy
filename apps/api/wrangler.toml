name = "sloppy-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# The snapshot is edge-cached, so most reads never reach the Worker. That is
# what keeps this inside the free tier well past the point you would expect.

[[d1_databases]]
binding = "DB"
database_name = "sloppy"
database_id = "0d341987-50cf-4fbe-b661-5905f86429e5"

[triggers]
# Rebuild the author rollup nightly. The window is 90 days and moves slowly;
# there is nothing to gain from running it more often.
crons = ["17 4 * * *"]

[vars]
# Empty means any origin. The official extension uses host_permissions for
# this Worker, so CORS is for wrangler-dev and anything that is not the
# shipped client.
ALLOWED_ORIGINS = ""

[observability]
enabled = true
